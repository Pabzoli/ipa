plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Production release signing: reads android/key.properties (gitignored).
// A missing key.properties falls back to debug signing so local debug/CI
// builds still work — but a `flutter build appbundle --release` produced
// without a keystore is NOT for Play distribution.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def loadReleaseSigning = {
    if (keystorePropertiesFile.exists()
        && keystorePropertiesFile.canRead()
        && keystoreProperties['storeFile']
        && keystoreProperties['storePassword']
        && keystoreProperties['keyPassword']
        && keystoreProperties['keyAlias']) {
        return android.signingConfigs.release
    }
    return null
}

android {
    namespace "com.animequiz.app"
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
    coreLibraryDesugaringEnabled true
}

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
    applicationId "com.animequiz.app"
    minSdkVersion flutter.minSdkVersion
    targetSdkVersion 35
    // Sourced from the `version: <name>+<build>` field in pubspec.yaml, which
    // the Flutter Gradle plugin mirrors into local.properties as
    // flutter.versionCode / flutter.versionName at build time. These two
    // locals were previously computed and then IGNORED in favour of hardcoded
    // literals, which meant pubspec could never change the shipped build
    // number — and the forced-update gate compares versionCode against
    // app_config/android.minBuild, so that drift would have silently broken
    // the gate. pubspec.yaml is now the single source of truth.
    versionCode flutterVersionCode.toInteger()
    versionName flutterVersionName
    multiDexEnabled true
    // App copy is English-only (plain-string literals, no l10n layer):
    // drop the 100+ locales bundled by GMS/Firebase to save ~1MB.
    resConfigs 'en'
}

    buildTypes {
        release {
            // Production signing from android/key.properties. Falls back to
            // debug signing ONLY when key.properties is absent (local debug).
            signingConfig loadReleaseSigning() ?: signingConfigs.debug
            // Direct-APK distribution: strip dead code (R8) and unused
            // resources so the sideloaded download stays small.
            minifyEnabled true
            shrinkResources true
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.play:integrity:1.4.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
